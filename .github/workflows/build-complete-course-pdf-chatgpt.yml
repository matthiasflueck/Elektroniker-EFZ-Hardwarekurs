name: Build complete course PDF (ChatGPT temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-complete-course-pdf-chatgpt.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-german fonts-dejavu-core fonts-noto-core fonts-noto-extra \
            poppler-utils

      - name: Build combined Markdown with internal navigation
        shell: bash
        run: |
          cat > /tmp/build_course.py <<'PY'
          from pathlib import Path, PurePosixPath
          import re, os, unicodedata, html

          root = Path.cwd()

          def slug_path(p: str) -> str:
              s = p.lower().replace("\\", "/")
              s = re.sub(r'[^a-z0-9]+', '-', s)
              return 'doc-' + s.strip('-')

          def title_from_path(p: Path) -> str:
              stem = p.stem
              if stem.lower() == 'readme':
                  stem = p.parent.name if p.parent.name else 'Kursübersicht'
              stem = re.sub(r'^\d+[-_]', '', stem)
              stem = stem.replace('-', ' ').replace('_', ' ')
              return stem.strip().title()

          # Course content order.
          paths = []
          if (root / "README.md").exists():
              paths.append(Path("README.md"))

          module_dirs = sorted(
              [p for p in root.iterdir() if p.is_dir() and re.match(r'^\d\d-', p.name)],
              key=lambda p: p.name
          )
          for d in module_dirs:
              readme = d / "README.md"
              if readme.exists():
                  paths.append(readme.relative_to(root))
              for f in sorted(d.glob("*.md")):
                  if f.name != "README.md":
                      paths.append(f.relative_to(root))

          for dirname in ["exkurse", "uebungen", "loesungen", "praxis", "projekte", "bildungsplan-2026", "referenz"]:
              d = root / dirname
              if not d.exists():
                  continue
              readme = d / "README.md"
              if readme.exists():
                  paths.append(readme.relative_to(root))
              for f in sorted(d.rglob("*.md")):
                  if f == readme or "bilder" in f.parts or "scripts" in f.parts or ".github" in f.parts:
                      continue
                  paths.append(f.relative_to(root))

          # Unique while preserving order.
          seen = set()
          ordered = []
          for p in paths:
              s = p.as_posix()
              if s not in seen:
                  seen.add(s)
                  ordered.append(p)
          paths = ordered

          existing = {p.as_posix(): slug_path(p.as_posix()) for p in paths}

          def resolve_rel(src: Path, target: str) -> str:
              target = target.strip()
              if target.startswith("<") and target.endswith(">"):
                  target = target[1:-1]
              if target.startswith(("http://", "https://", "mailto:", "tel:", "data:")):
                  return target
              if target.startswith("#"):
                  return target
              # Preserve optional title after URL: path "title"
              m = re.match(r'^(\S+)(\s+["\'].*["\'])$', target)
              suffix = ""
              if m:
                  target, suffix = m.group(1), m.group(2)
              frag = ""
              if "#" in target:
                  target, frag = target.split("#", 1)
              if not target:
                  return "#" + frag
              # Resolve repository-relative / source-relative path.
              if target.startswith("/"):
                  norm = PurePosixPath(target.lstrip("/"))
              else:
                  norm = PurePosixPath(os.path.normpath((src.parent / target).as_posix()))
              norm_s = norm.as_posix()
              if norm_s.endswith(".md") and norm_s in existing:
                  return "#" + existing[norm_s] + suffix
              # Images and other local assets should be repo-root relative in master.md.
              if norm_s in [x.as_posix() for x in root.rglob("*") if x.is_file()]:
                  return norm_s + (("#" + frag) if frag else "") + suffix
              return norm_s + (("#" + frag) if frag else "") + suffix

          link_re = re.compile(r'(!?\[[^\]]*\]\()([^)]+)(\))')

          def rewrite_links(text: str, src: Path) -> str:
              def repl(m):
                  return m.group(1) + resolve_rel(src, m.group(2)) + m.group(3)
              return link_re.sub(repl, text)

          def module_num_from_path(p: Path):
              m = re.match(r'^(\d\d)-', p.parts[0]) if p.parts else None
              if m:
                  return m.group(1)
              m = re.match(r'modul-(\d\d)', p.stem)
              return m.group(1) if m else None

          def module_readme_anchor(n: str):
              for p, a in existing.items():
                  if p.startswith(n + "-") and p.endswith("/README.md"):
                      return a
              return None

          def support_anchor(prefix: str, n: str):
              candidates = []
              for p, a in existing.items():
                  if p.startswith(prefix + "/modul-" + n):
                      candidates.append((p, a))
              return sorted(candidates)[0][1] if candidates else None

          out = []
          out += [
              "---",
              'title: "Elektroniker/in EFZ - Hardwarekurs 2026"',
              'subtitle: "Gesamtausgabe aus dem GitHub-Kurs"',
              'author: "Kursrepository: matthiasflueck/Elektroniker-EFZ-Hardwarekurs"',
              'date: "22. September 2026"',
              "lang: de-CH",
              "---",
              "",
              r"\hypertarget{course-start}{}",
              "",
              "# Schnellnavigation",
              "",
              "[Inhaltsverzeichnis](#toc) · [Übungen](#doc-uebungen-readme-md) · [Lösungen](#doc-loesungen-readme-md) · [Praxis](#doc-praxis-readme-md) · [Projekte](#doc-projekte-readme-md)",
              "",
          ]

          for i, p in enumerate(paths):
              raw = (root / p).read_text(encoding="utf-8")
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              raw = rewrite_links(raw, p)

              # Avoid duplicate YAML front matter from source files.
              if raw.startswith("---\n"):
                  end = raw.find("\n---\n", 4)
                  if end != -1:
                      raw = raw[end+5:]

              anchor = existing[p.as_posix()]
              n = module_num_from_path(p)

              nav = ["[↑ Inhaltsverzeichnis](#toc)"]
              if n:
                  ma = module_readme_anchor(n)
                  ua = support_anchor("uebungen", n)
                  la = support_anchor("loesungen", n)
                  pa = support_anchor("praxis", n)
                  if ma and ma != anchor:
                      nav.append(f"[Modul {n}](#{ma})")
                  if ua and ua != anchor:
                      nav.append(f"[Übungen {n}](#{ua})")
                  if la and la != anchor:
                      nav.append(f"[Lösungen {n}](#{la})")
                  if pa and pa != anchor:
                      nav.append(f"[Praxis {n}](#{pa})")

              if i > 0:
                  out += ["", r"\clearpage", ""]
              out += [
                  f"[]{{#{anchor}}}",
                  "",
                  " · ".join(nav),
                  "",
                  raw.strip(),
                  ""
              ]

          Path("master.md").write_text("\n".join(out), encoding="utf-8")

          Path("header.tex").write_text(r'''
          \usepackage{fontspec}
          \setmainfont{DejaVu Sans}
          \setsansfont{DejaVu Sans}
          \setmonofont{DejaVu Sans Mono}
          \usepackage{hyperref}
          \hypersetup{colorlinks=true,linkcolor=blue,urlcolor=blue,citecolor=blue,pdfborder={0 0 0}}
          \usepackage{bookmark}
          \usepackage{xcolor}
          \usepackage{fancyhdr}
          \usepackage{graphicx}
          \usepackage{listings}
          \lstset{breaklines=true,breakatwhitespace=false,basicstyle=\ttfamily\small,columns=fullflexible}
          \setlength{\headheight}{14pt}
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[L]{\scriptsize\hyperlink{toc}{\textcolor{blue}{\(\uparrow\) Inhaltsverzeichnis}}}
          \fancyfoot[C]{\thepage}
          \let\oldtableofcontents\tableofcontents
          \renewcommand{\tableofcontents}{\hypertarget{toc}{}\oldtableofcontents}
          \setcounter{tocdepth}{2}
          \setlength{\parindent}{0pt}
          \setlength{\parskip}{4pt}
          \emergencystretch=3em
          ''', encoding="utf-8")
          print(f"Included {len(paths)} Markdown files")
          PY
          python3 /tmp/build_course.py

      - name: Convert to PDF
        run: |
          pandoc master.md \
            --from=gfm+tex_math_dollars+raw_tex \
            --to=pdf \
            --pdf-engine=xelatex \
            --toc --toc-depth=2 \
            --metadata=geometry:a4paper \
            --metadata=geometry:margin=18mm \
            --metadata=geometry:headheight=15pt \
            --include-in-header=header.tex \
            --listings \
            --resource-path=".:bilder" \
            --output=Elektroniker-EFZ-Hardwarekurs-Gesamtausgabe.pdf

      - name: Sanity-check PDF
        run: |
          pdfinfo Elektroniker-EFZ-Hardwarekurs-Gesamtausgabe.pdf
          test -s Elektroniker-EFZ-Hardwarekurs-Gesamtausgabe.pdf
          pdftotext Elektroniker-EFZ-Hardwarekurs-Gesamtausgabe.pdf /tmp/course.txt
          grep -q "Elektroniker" /tmp/course.txt
          grep -q "Inhaltsverzeichnis" /tmp/course.txt

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: elektroniker-efz-hardwarekurs-pdf
          path: Elektroniker-EFZ-Hardwarekurs-Gesamtausgabe.pdf
          if-no-files-found: error
          retention-days: 1
