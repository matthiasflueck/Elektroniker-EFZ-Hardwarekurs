<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc"><title id="title">Kennlinie und Steigung</title><desc id="desc">Diagramm mit beschrifteten Achsen, Arbeitspunkt und Steigungsdreieck.</desc><style>.w{stroke:#172033;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#172033;stroke-width:3;fill:#fff}.t{font:16px system-ui,sans-serif;fill:#172033}.s{font:13px system-ui,sans-serif;fill:#445}.a{stroke:#087ea4;stroke-width:3;fill:none;marker-end:url(#arrow)}.g{stroke:#15803d;stroke-width:3;fill:none}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087ea4"/></marker></defs><path class="w" d="M90 350V55m0 295h650"/><text class="t" x="665" y="388">Eingangsgrösse x</text><text class="t" transform="translate(35 215) rotate(-90)">Ausgangsgrösse y</text><path d="M110 330 C250 315 310 270 390 220 S580 100 710 80" stroke="#087ea4" stroke-width="5" fill="none"/><circle cx="390" cy="220" r="7" fill="#b91c1c"/><text class="t" x="405" y="212">Arbeitspunkt</text><path class="g" d="M270 285h190V180"/><text class="s" x="345" y="307">Δx</text><text class="s" x="470" y="240">Δy</text><text class="s" x="280" y="155">lokale Steigung ≈ Δy/Δx</text></svg>
