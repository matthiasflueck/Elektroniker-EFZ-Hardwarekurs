<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Schema systematisch lesen</title><desc id="d">Ein Blockdiagramm zeigt die Leserichtung von Versorgung und Bezug über Ein- und Ausgang, Funktionsblöcke und Strompfad bis zu Testpunkten und Grenzwerten.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2c628f"/></marker></defs><rect width="1200" height="430" fill="#fbfcfe"/><text x="600" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b5e">Schaltplan: vom Rahmen zum Strompfad</text><g font-family="sans-serif" text-anchor="middle" fill="#173b5e"><g fill="#eaf2f9" stroke="#2c628f" stroke-width="3"><rect x="30" y="120" width="190" height="100" rx="12"/><rect x="265" y="120" width="190" height="100" rx="12"/><rect x="500" y="120" width="190" height="100" rx="12"/><rect x="735" y="120" width="190" height="100" rx="12"/><rect x="970" y="120" width="200" height="100" rx="12"/></g><g font-size="20"><text x="125" y="158">1 Versorgung</text><text x="125" y="187">und Bezug</text><text x="360" y="158">2 Ein- und</text><text x="360" y="187">Ausgänge</text><text x="595" y="158">3 Funktions-</text><text x="595" y="187">blöcke</text><text x="830" y="158">4 Strom- und</text><text x="830" y="187">Signalpfade</text><text x="1070" y="158">5 Testpunkte</text><text x="1070" y="187">und Grenzen</text></g></g><g stroke="#2c628f" stroke-width="4" marker-end="url(#a)"><path d="M220 170H255"/><path d="M455 170H490"/><path d="M690 170H725"/><path d="M925 170H960"/></g><rect x="280" y="290" width="640" height="72" rx="12" fill="#fff3d8" stroke="#a66d08" stroke-width="2"/><text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#704700">Für jeden Zustand: Wo kann Strom fliessen?</text><text x="600" y="347" text-anchor="middle" font-family="sans-serif" font-size=