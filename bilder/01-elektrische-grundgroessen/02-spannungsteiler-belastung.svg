<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Unbelasteter und belasteter Spannungsteiler</title><desc id="d">Links ein Spannungsteiler aus zwei Zehn-Kiloohm-Widerständen mit 2,5 Volt Ausgang, rechts derselbe Teiler mit Zehn-Kiloohm-Last und 1,67 Volt Ausgang.</desc><rect width="1200" height="500" fill="#fbfcfe"/><g font-family="sans-serif" fill="#173b5e"><text x="300" y="45" text-anchor="middle" font-size="27" font-weight="700">unbelastet</text><text x="900" y="45" text-anchor="middle" font-size="27" font-weight="700">mit Last R<tspan baseline-shift="sub">L</tspan> = 10 kΩ</text></g><g stroke="#285f8f" stroke-width="5" fill="none"><path d="M300 80V130"/><rect x="250" y="130" width="100" height="90" fill="#eef5fb"/><path d="M300 220V285"/><rect x="250" y="285" width="100" height="90" fill="#eef5fb"/><path d="M300 375V430"/><path d="M900 80V130"/><rect x="850" y="130" width="100" height="90" fill="#eef5fb"/><path d="M900 220V285"/><rect x="850" y="285" width="100" height="90" fill="#eef5fb"/><path d="M900 375V430"/><path d="M900 255H1050V285"/><rect x="1000" y="285" width="100" height="90" fill="#fff4da"/><path d="M1050 375V430H900"/></g><g font-family="sans-serif" font-size="21" text-anchor="middle" fill="#173b5e"><text x="300" y="115">5 V</text><text x="300" y="182">R1 10 kΩ</text><text x="300" y="270">OUT = 2.50 V</text><text x="300" y="337">R2 10 kΩ</text><text x="300" y="462">0 V</text><text x="900" y="115">5 V</text><text x="900" y="182">R1 10 kΩ</text><text x="900" y="270">OUT = 1.67 V</text><text x="900" y="337">R2 10 kΩ</text><text x="1050" y="337">R<tspan baseline-shift="sub">L</tspan> 10 kΩ</text><text x="900" y="462">0 V</text></g></svg>
