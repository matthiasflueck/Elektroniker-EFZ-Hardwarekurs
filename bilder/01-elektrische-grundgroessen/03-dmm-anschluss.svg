<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Richtiger Anschluss eines Digitalmultimeters</title><desc id="d">Drei Felder zeigen Voltmeter parallel, Amperemeter in Reihe und Ohmmeter nur an einer energiefreien, getrennten Schaltung.</desc><rect width="1200" height="420" fill="#fbfcfe"/><g font-family="sans-serif" text-anchor="middle"><text x="200" y="42" font-size="26" font-weight="700" fill="#1c4b72">Spannung</text><text x="600" y="42" font-size="26" font-weight="700" fill="#1c4b72">Strom</text><text x="1000" y="42" font-size="26" font-weight="700" fill="#1c4b72">Widerstand</text><g stroke="#285f8f" stroke-width="5" fill="none"><path d="M70 170H330"/><rect x="155" y="135" width="90" height="70" fill="#eef5fb"/><path d="M110 170V290H290V170"/><circle cx="200" cy="290" r="48" fill="#fff"/><path d="M470 170H555"/><circle cx="600" cy="170" r="48" fill="#fff"/><path d="M648 170H730"/><rect x="555" y="270" width="90" height="70" fill="#eef5fb"/><path d="M815 250H900"/><rect x="900" y="215" width="90" height="70" fill="#eef5fb"/><path d="M990 250H1070"/><circle cx="1100" cy="250" r="48" fill="#fff"/></g><g font-size="22" fill="#173b5e"><text x="200" y="178">Last</text><text x="200" y="298">V</text><text x="600" y="178">A</text><text x="600" y="312">Last</text><text x="945" y="258">R</text><text x="1100" y="258">Ω</text></g><text x="200" y="375" font-size="20" fill="#1f7a5a">parallel, hoher Eingangswiderstand</text><text x="600" y="375" font-size="20" fill="#b03a2e">in Reihe, Schaltung vorher AUS</text><text x="1000" y="375" font-size="20" fill="#b03a2e">energiefrei und getrennt</text></g></svg>
