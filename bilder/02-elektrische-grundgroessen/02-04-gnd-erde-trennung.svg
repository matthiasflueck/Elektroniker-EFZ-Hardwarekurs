<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">GND, Chassis und PE</title><desc id="desc">Getrennter Signalbezug, Gehäuse und Schutzleiter mit bewusst definierter Kopplung.</desc><style>.w{stroke:#172033;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#172033;stroke-width:3;fill:#fff}.t{font:16px system-ui,sans-serif;fill:#172033}.s{font:13px system-ui,sans-serif;fill:#445}.a{stroke:#087ea4;stroke-width:3;fill:none;marker-end:url(#arrow)}.g{stroke:#15803d;stroke-width:3;fill:none}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087ea4"/></marker></defs><rect x="70" y="70" width="250" height="180" rx="12" fill="#eef7ff" stroke="#087ea4" stroke-width="3"/><text class="t" x="105" y="110">galvanisch getrennter</text><text class="t" x="145" y="135">Stromkreis</text><path class="w" d="M195 170v55m-30 0h60m-45 14h30m-20 12h10"/><text class="t" x="160" y="285">GND / 0 V</text><rect x="575" y="70" width="250" height="180" rx="12" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/><text class="t" x="650" y="110">Gehäuse</text><path class="w" d="M700 160v65m-30 0h60m-45 14h30m-20 12h10"/><text class="t" x="650" y="285">Chassis</text><path class="w" d="M700 250v85m-35 0h70m-52 15h34m-22 15h10"/><text class="t" x="742" y="350">PE</text><path d="M320 170h255" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="10 8"/><text class="s" x="346" y="155">nur nach definiertem Schutz-/EMV-Konzept</text></svg>
