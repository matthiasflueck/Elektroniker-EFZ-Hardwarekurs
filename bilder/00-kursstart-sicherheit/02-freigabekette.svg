<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Freigabekette vor der Messung</title><desc id="desc">Vier aufeinanderfolgende Freigaben für Dokument, Aufbau, Energie und Messung, gefolgt vom Soll-Ist-Vergleich.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b58"/></marker></defs>
  <rect width="1100" height="380" fill="#f7faf9"/>
  <text x="550" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#133d34">Freigabe vor Energie und Messung</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g stroke-width="3"><circle cx="120" cy="160" r="70" fill="#e8f5f1" stroke="#176b58"/><circle cx="335" cy="160" r="70" fill="#e8f5f1" stroke="#176b58"/><circle cx="550" cy="160" r="70" fill="#fff3d6" stroke="#a86b00"/><circle cx="765" cy="160" r="70" fill="#fff3d6" stroke="#a86b00"/><circle cx="980" cy="160" r="70" fill="#e8f5f1" stroke="#176b58"/></g>
    <g font-size="20" font-weight="700" fill="#133d34"><text x="120" y="150">1 Dokument</text><text x="120" y="178">Revision</text><text x="335" y="150">2 Aufbau</text><text x="335" y="178">Polarität</text><text x="550" y="150">3 Energie</text><text x="550" y="178">Grenzen</text><text x="765" y="150">4 Messung</text><text x="765" y="178">Bezug</text><text x="980" y="150">5 Bewertung</text><text x="980" y="178">Soll ↔ Ist</text></g>
  </g>
  <g stroke="#176b58" stroke-width="4" marker-end="url(#arr)"><path d="M190 160H255"/><path d="M405 160H470"/><path d="M620 160H685"/><path d="M835 160H900"/></g>
  <rect x="410" y="280" width="280" height="55" rx="10" fill="#fde8e7" stroke="#a63c36" stroke-width="2"/><text x="550" y="314" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#7e2925">Bei Abweichung: AUS → Ursache klären</text>
</svg>
