<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">ESD-Arbeitsplatz</title><desc id="desc">Person, ESD-Matte und Baugruppe sind über definierte Widerstände mit einem gemeinsamen Erdungspunkt verbunden.</desc><style>.w{stroke:#172033;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#172033;stroke-width:3;fill:#fff}.t{font:16px system-ui,sans-serif;fill:#172033}.s{font:13px system-ui,sans-serif;fill:#445}.a{stroke:#087ea4;stroke-width:3;fill:none;marker-end:url(#arrow)}.g{stroke:#15803d;stroke-width:3;fill:none}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087ea4"/></marker></defs>
<rect x="40" y="40" width="820" height="330" rx="16" fill="#f7fafc" stroke="#cbd5e1"/><rect x="340" y="90" width="300" height="120" rx="8" fill="#e6f6ee" stroke="#15803d" stroke-width="3"/><text class="t" x="410" y="145">ESD-Matte / EPA</text><rect class="r" x="440" y="160" width="100" height="35"/><text class="s" x="457" y="184">Baugruppe</text><circle class="r" cx="155" cy="120" r="28"/><path class="w" d="M155 148v92m-55-50h110m-55 50l-45 80m45-80l45 80"/><text class="t" x="90" y="355">Person</text><rect class="r" x="230" y="185" width="90" height="34"/><text class="s" x="244" y="208">1 MΩ</text><path class="w" d="M210 190h20m90 12h65"/><rect class="r" x="650" y="245" width="90" height="34"/><text class="s" x="664" y="268">1 MΩ</text><path class="w" d="M530 210v52h120m90 0h45"/><circle cx="785" cy="262" r="6" fill="#172033"/><path class="w" d="M785 262v55m-28 0h56m-43 14h30m-18 14h6"/><text class="t" x="705" y="382">gemeinsamer ESD-Punkt</text><text class="s" x="335" y="65">Kontrollierter Potentialausgleich – keine direkte improvisierte Verbindung</text></svg>
